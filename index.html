<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Predictions and Odds</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #030303;
  --panel: #0d0d0d;
  --panel2: #141414;
  --line: #222222;
  --text: #f7f7f7;
  --muted: #888888;
  --red: #ef1b2d;
  --red-hover: #d01526;
  --font-main: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-main);
  line-height: 1.5;
  padding: 20px 10px;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 1000px; margin: 0 auto; }

/* Top controls */
.pred-head { display: flex; flex-direction: column; gap: 14px; margin-bottom: 16px; }
.pred-head h1 { font-size: 22px; font-weight: 900; letter-spacing: -0.02em; }
.pred-tabs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 9px 16px; font-weight: 700; font-size: 13px; text-transform: uppercase;
  background: transparent; border: 1px solid var(--line); color: var(--text); cursor: pointer;
  transition: all 0.2s ease;
}
.btn:hover, .btn.active { background: var(--red); border-color: var(--red); color: #fff; }

.fx-search {
  background: #0a0a0a; border: 1px solid var(--line); color: #fff;
  padding: 9px 14px; font-family: var(--font-main); outline: none;
  width: 100%; max-width: 280px; font-size: 13px; margin-left: auto;
}
.fx-search:focus { border-color: var(--red); }
@media (max-width: 600px) { .fx-search { margin-left: 0; max-width: 100%; } }

/* Table Wrapper for Horizontal Scroll */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); background: #0d0d0d; }

.pred-table { width: 100%; min-width: 900px; border-collapse: collapse; font-family: var(--font-main); }
.pred-table th, .pred-table td { padding: 12px; text-align: center; vertical-align: middle; border: 1px solid #141414; }

/* Headers */
.th-main th { background: var(--red); color: #fff; font-weight: 800; text-transform: uppercase; font-size: 12px; border: 1px solid #d01526; }
.th-sub th { background: #141414; color: #888; font-weight: 700; font-size: 11px; border: 1px solid #222; text-transform: uppercase; }

/* Alternating rows */
.pred-table tbody tr:nth-child(odd) { background: #0a0a0a; }
.pred-table tbody tr:nth-child(even) { background: #0d0d0d; }
.pred-table tbody tr { border-bottom: 1px solid #222; }

/* Sticky Time Column */
.pred-table .col-time {
  position: sticky; left: 0; width: 70px; min-width: 70px; max-width: 70px;
  z-index: 10; border-right: 1px solid #141414; background: inherit;
}
.pred-table thead .col-time { z-index: 12; background: var(--red); }

/* League Header Row */
.league-row td {
  background: #141414 !important; border-bottom: 2px solid var(--red);
  padding: 8px 12px; text-align: left;
}
.league-flag { width: 16px; height: 11px; object-fit: cover; margin-right: 8px; vertical-align: middle; }
.league-name { color: var(--red); font-weight: 800; font-size: 12px; text-transform: uppercase; vertical-align: middle; }

/* Table Content Styling */
.time-box { display: flex; flex-direction: column; align-items: center; justify-content: center; }
.time-val { font-size: 14px; font-weight: 800; }
.time-date { font-size: 10px; color: var(--muted); margin-top: 2px; }

.match-box { display: flex; align-items: center; justify-content: center; width: 100%; gap: 10px; }
.match-team { flex: 1; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
.match-home { justify-content: flex-end; text-align: right; }
.match-away { justify-content: flex-start; text-align: left; }
.match-vs { font-size: 11px; color: var(--muted); font-weight: 800; }
.team-logo { width: 20px; height: 20px; object-fit: contain; }
.team-no-logo { width: 20px; height: 20px; background: #222; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; color: #fff; text-transform: uppercase; }

.prob-val { font-size: 14px; font-weight: 800; }
.prob-high { background: var(--red); color: #fff; border: 1px solid var(--red); }

.pick-val { font-size: 15px; font-weight: 900; background: var(--red); color: #fff; }
.pick-correct { background: var(--red); color: #fff; border: 2px solid #fff; }
.pick-wrong { background: #141414; color: #666; border: 1px solid #333; }

.cs-val { background: #1c1c1c; color: #fff; font-weight: 800; font-size: 14px; }
.odds-val { font-size: 13px; font-weight: 600; color: #ccc; }

.res-score { font-size: 14px; font-weight: 800; }
.res-stat { font-size: 10px; color: var(--muted); margin-top: 2px; }

/* Movement Indicators */
.tri-up { display: inline-block; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 5px solid #fff; margin-left: 4px; vertical-align: middle; }
.tri-down { display: inline-block; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid var(--red); margin-left: 4px; vertical-align: middle; }
</style>
</head>
<body>

<main class="wrap">
  <div class="pred-head">
    <h1 id="pred-heading">Predictions and odds - Today</h1>
    <div class="pred-tabs">
      <button class="btn active" id="tab-today">Today</button>
      <button class="btn" id="tab-tomorrow">Tomorrow</button>
      <button class="btn" id="tab-all">All</button>
      <input type="text" id="fx-q" placeholder="Search team or league..." class="fx-search">
    </div>
  </div>

  <div class="table-wrap">
    <table class="pred-table" id="predictions">
      <thead>
        <tr class="th-main">
          <th rowspan="2" class="col-time">Time</th>
          <th>Match</th>
          <th colspan="3">Pred.</th>
          <th rowspan="2">Pick</th>
          <th rowspan="2">Avg<br>Goals</th>
          <th>Correct Score</th>
          <th rowspan="2">Result</th>
          <th>Odds</th>
        </tr>
        <tr class="th-sub">
          <th>Home Team <span style="color:#666;font-size:9px;margin:0 4px">VS</span> Away Team</th>
          <th>1</th>
          <th>X</th>
          <th>2 %</th>
          <th>Predicted</th>
          <th>Home/Draw/Away</th>
        </tr>
      </thead>
      <tbody id="fx-body">
        <!-- Injected via JavaScript -->
      </tbody>
    </table>
  </div>
</main>

<script>
const fxBody = document.getElementById('fx-body');
const fxQ = document.getElementById('fx-q');
const predHeading = document.getElementById('pred-heading');
let allMatches = [];

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str ?? '';
  return d.innerHTML;
}

async function fetchPredData(tab) {
  try {
    const url = `/api/feed/matches?day=${tab}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('API error');
    const data = await res.json();
    allMatches = data.matches || data || [];
  } catch (err) {
    console.error('Failed to load feed:', err);
    allMatches = [];
  }
  renderPredictions();
}

function getTeamLogo(url, name) {
  const short = name ? name.substring(0, 2).toUpperCase() : '??';
  const safeName = escapeHtml(name || '').replace(/'/g, "&#39;");
  if (url) {
    return `<img src="${escapeHtml(url)}" alt="" class="team-logo" onerror="this.outerHTML='<div class=\\'team-no-logo\\'>${safeName.substring(0,2)}</div>'">`;
  }
  return `<div class="team-no-logo">${escapeHtml(short)}</div>`;
}

function getOddsArr(dir) {
  if (dir === 'up') return '<span class="tri-up"></span>';
  if (dir === 'down') return '<span class="tri-down"></span>';
  return '';
}

function formatOdds(val) {
  const n = parseFloat(val);
  return isNaN(n) ? (val || '-') : n.toFixed(2);
}

function renderPredictions() {
  if (!fxBody) return;
  const q = (fxQ.value || '').toLowerCase();
  const filtered = allMatches.filter(m => 
    (m.home && m.home.toLowerCase().includes(q)) ||
    (m.away && m.away.toLowerCase().includes(q)) ||
    (m.league_name && m.league_name.toLowerCase().includes(q)) ||
    (m.league_tag && m.league_tag.toLowerCase().includes(q))
  );

  let html = '';
  let currentLeague = '';

  filtered.forEach(m => {
    const leagueTitle = m.league_name || m.league_tag || 'FOOTBALL LEAGUE';
    
    if (leagueTitle !== currentLeague) {
      currentLeague = leagueTitle;
      const flagImg = m.flag_url ? `<img src="${escapeHtml(m.flag_url)}" class="league-flag" onerror="this.style.display='none'">` : '';
      html += `<tr class="league-row">
        <td colspan="10">
          ${flagImg}
          <span class="league-name">${escapeHtml(leagueTitle)}</span>
        </td>
      </tr>`;
    }

    let timeStr = '', dateStr = '';
    if (m.kickoff_utc) {
      const d = new Date(m.kickoff_utc);
      timeStr = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Africa/Kampala' });
      dateStr = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', timeZone: 'Africa/Kampala' });
    }

    const p1 = Number(m.prob_home) || 0;
    const pX = Number(m.prob_draw) || 0;
    const p2 = Number(m.prob_away) || 0;
    const pMax = Math.max(p1, pX, p2);

    let pickCls = 'pick-val';
    if (m.status === 'FT') {
      const sc = (m.live_score || '').split('-');
      if (sc.length === 2) {
        const sh = Number(sc[0]), sa = Number(sc[1]);
        let actual = 'X'; if (sh > sa) actual = '1'; if (sa > sh) actual = '2';
        if (m.pick == actual) pickCls += ' pick-correct';
        else pickCls += ' pick-wrong';
      }
    }

    const oH = formatOdds(m.odds_home) + getOddsArr(m.odds_movement?.[0]);
    const oD = formatOdds(m.odds_draw) + getOddsArr(m.odds_movement?.[1]);
    const oA = formatOdds(m.odds_away) + getOddsArr(m.odds_movement?.[2]);

    html += `<tr>
      <td class="col-time">
        <div class="time-box">
          <span class="time-val">${escapeHtml(timeStr)}</span>
          <span class="time-date">${escapeHtml(dateStr)}</span>
        </div>
      </td>
      <td>
        <div class="match-box">
          <div class="match-team match-home"><span>${escapeHtml(m.home)}</span>${getTeamLogo(m.home_logo, m.home)}</div>
          <div class="match-vs">vs</div>
          <div class="match-team match-away">${getTeamLogo(m.away_logo, m.away)}<span>${escapeHtml(m.away)}</span></div>
        </div>
      </td>
      <td class="prob-val ${p1 === pMax && pMax > 0 ? 'prob-high' : ''}">${p1}%</td>
      <td class="prob-val ${pX === pMax && pMax > 0 ? 'prob-high' : ''}">${pX}%</td>
      <td class="prob-val ${p2 === pMax && pMax > 0 ? 'prob-high' : ''}">${p2}%</td>
      <td class="${pickCls}">${escapeHtml(m.pick || '-')}</td>
      <td style="font-weight:700">${escapeHtml(String(m.avg_goals || '-'))}</td>
      <td class="cs-val">${escapeHtml(m.predicted_score || '-')}</td>
      <td>
        <div class="res-score">${escapeHtml(m.live_score || '-')}</div>
        <div class="res-stat">${escapeHtml(m.status || '')}</div>
      </td>
      <td class="odds-val">${oH} / ${oD} / ${oA}</td>
    </tr>`;
  });

  if (filtered.length === 0) {
    html = `<tr><td colspan="10" style="text-align:center;padding:40px;color:var(--muted)">No predictions found.</td></tr>`;
  }
  fxBody.innerHTML = html;
}

function updatePredHeading(tab) {
  if (!predHeading) return;
  if (tab === 'all') {
    predHeading.textContent = `Predictions and odds - All Matches`;
    return;
  }
  
  const now = new Date();
  if (tab === 'tomorrow') now.setDate(now.getDate() + 1);

  const dayNum = parseInt(now.toLocaleDateString('en-US', { day: 'numeric', timeZone: 'Africa/Kampala' }));
  const monthName = now.toLocaleDateString('en-US', { month: 'long', timeZone: 'Africa/Kampala' });
  const yearNum = now.toLocaleDateString('en-US', { year: 'numeric', timeZone: 'Africa/Kampala' });
  const weekdayName = now.toLocaleDateString('en-US', { weekday: 'long', timeZone: 'Africa/Kampala' });

  const suffix = ['th', 'st', 'nd', 'rd'][(dayNum % 10 > 3 || Math.floor(dayNum % 100 / 10) === 1) ? 0 : dayNum % 10];
  const formattedDate = `${weekdayName}, ${monthName} ${dayNum}${suffix}, ${yearNum}`;

  const capTab = tab.charAt(0).toUpperCase() + tab.slice(1);
  predHeading.textContent = `Predictions and odds - ${capTab} (${formattedDate})`;
}

document.querySelectorAll('.pred-tabs .btn').forEach(b => {
  b.addEventListener('click', (e) => {
    document.querySelectorAll('.pred-tabs .btn').forEach(x => x.classList.remove('active'));
    e.target.classList.add('active');
    const tab = e.target.id.replace('tab-', '');
    updatePredHeading(tab);
    fetchPredData(tab);
  });
});

if (fxQ) fxQ.addEventListener('input', renderPredictions);

// Initial Load
updatePredHeading('today');
fetchPredData('today');
</script>

</body>
</html>
